:root {
  --peach: #ffd2c4;
  --coral: #ff8a66;
  --app: #f3f5fa;
  --card: #fff;
  --ink: #172033;
  --muted: #8a90a2;
  --line: #e6e9f0;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: linear-gradient(135deg,#ffd7ca,#ffcabc);
  color: var(--ink);
  font-family: "Nunito Sans","Poppins",ui-rounded,system-ui,sans-serif;
}
button,a,input {
  font: inherit;
}
button,a {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,a:focus-visible,input:focus-visible {
  outline: 3px solid rgb(47 128 237 / 35%);
  outline-offset: 2px;
}
h1 {
  font-size: clamp(1.75rem,3vw,2.25rem);
  line-height: 1.1;
  font-weight: 800;
}
h2 {
  font-size: 1.25rem;
  font-weight: 800;
}
.canvas {
  min-height: 100vh;
  padding: 26px 26px 26px 188px;
}
.shell {
  display: grid;
  grid-template-columns: minmax(0,1fr) 292px;
  grid-template-rows: 82px minmax(calc(100vh - 134px),auto);
  max-width: 1540px;
  min-width: 0;
  margin: auto;
  overflow: hidden;
  border-radius: 26px;
  background: var(--app);
  box-shadow: 0 28px 70px rgb(74 41 31 / 16%);
}
.topbar {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 34px;
  background: linear-gradient(90deg,#f3f5fa 0 80%,#fff 80%);
  border-bottom: 1px solid rgb(230 233 240 / 65%);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: max-content;
  font-size: 1.35rem;
}
.logo {
  position: relative;
  width: 34px;
  height: 28px;
  display: block;
}
.logo i:first-child {
  position: absolute;
  inset: 0 10px 7px 0;
  background: #12ae80;
  clip-path: polygon(0 0,100% 0,0 100%);
}
.logo i:last-child {
  position: absolute;
  inset: 7px 0 0 10px;
  background: #ffb315;
  clip-path: polygon(100% 0,100% 100%,0 100%);
}
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 190px;
  height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  background: rgb(255 255 255 / 76%);
  color: #64748b;
  box-shadow: 0 3px 16px rgb(40 52 77 / 4%);
}
.search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
}
.desktop-nav {

    <a href="#income">Entrée d’argent</a>
  </aside>
  <div id="app"></div>
  <nav class="mobile-switcher" aria-label="Écrans mobiles"></nav>
  <script>
/* Budget Tracker v2 — JavaScript vanilla, sans dépendance */
const screens = [
  ["design-system","Design system","DS"], ["dashboard","Dashboard mensuel","Mois"],
  ["general","Comparaison","Général"], ["categories","Catégories","Catégories"],
  ["expense","Saisie dépense","Dépense"], ["income","Entrée d’argent","Entrée"]
];
function getPreferredTheme(){
  try { const saved=localStorage.getItem("budget-tracker-theme"); if(saved) return saved; } catch {}
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme,persist=true){
  document.documentElement.dataset.theme=theme;
  if(persist){ try { localStorage.setItem("budget-tracker-theme",theme); } catch {} }
  const button=document.querySelector(".theme-toggle");
  if(button){ button.textContent=theme==="dark"?"☀":"☾"; button.setAttribute("aria-label",theme==="dark"?"Activer le mode clair":"Activer le mode sombre"); }
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); }
const roots = {
  alimentaire:{label:"Alimentaire",glyph:"▾",tone:"bg-emerald-100 text-emerald-500",children:["Alimentation générale","Boucherie","Restaurants"]},
  charges:{label:"Charges fixes",glyph:"⌂",tone:"bg-orange-100 text-orange-500",children:["Loyer","Internet","Électricité"]},
  transport:{label:"Transport",glyph:"▣",tone:"bg-blue-100 text-blue-500",children:["Carburant","Entretien","Bus"]},
  loisirs:{label:"Loisirs",glyph:"✦",tone:"bg-violet-100 text-violet-500",children:["Sorties","Jeux","Sport"]},
  sante:{label:"Santé",glyph:"♥",tone:"bg-rose-100 text-rose-500",children:["Pharmacie","Médecin"]}
};
const format = n => `${new Intl.NumberFormat("fr-FR").format(n)} FCFP`;
const icon = (key,small=false) => `<span class="icon ${small?"h-9 w-9 text-lg":"h-11 w-11 text-xl"} ${roots[key].tone}">${roots[key].glyph}</span>`;
const card = (html,cls="") => `<section class="card ${cls}">${html}</section>`;
const pill = text => `<button class="pill">${text}</button>`;
const title = (name,subtitle,action="") => `<div class="page-title"><div class="flex-1"><h1>${name}</h1><p>${subtitle}</p></div>${action}</div>`;
const stat = (name,value,color,glyph,delta="") => card(`<span class="icon h-12 w-12 bg-${color}-50 text-${color}-500 text-xl">${glyph}</span><div class="min-w-0"><p class="label">${name}</p><p class="mt-1 truncate text-xl font-extrabold text-${color}-500">${value}</p>${delta?`<p class="caption mt-1">${delta}</p>`:""}</div>`,"flex items-center gap-4 p-5");
const categoryRow = (key,amount,percent,child="") => `<div class="row">${icon(key)}<div class="min-w-0 flex-1"><p class="font-bold text-slate-800">${child||roots[key].label}</p><p class="caption">${child?roots[key].label:"Catégorie racine"}</p></div>${percent!==undefined?`<strong class="text-blue-500">${percent} %</strong>`:""}${amount!==undefined?`<strong class="whitespace-nowrap text-sm">${format(amount)}</strong>`:""}</div>`;
const donut = () => `<div class="relative mx-auto h-48 w-48 rounded-full income-pie"><div class="absolute inset-12 grid place-content-center rounded-full bg-white text-center"><strong class="text-2xl">260 000</strong><span class="caption">revenus</span></div></div>`;
const monthBars = () => `<div class="chart-grid"><div class="chart-y"><span>300k</span><span>225k</span><span>150k</span><span>75k</span><span>0</span></div><div class="chart-bars">${[56,68,61,74,66,81,73,88,80,92,86,95].map((v,i)=>`<div class="bar-slot"><i class="bar previous" style="height:${v*.72}%"></i><i class="bar current" style="height:${v}%"></i><small>${["Sep","Oct","Nov","Déc","Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août"][i]}</small></div>`).join("")}</div></div>`;
const topbar = current => `<header class="topbar"><div class="brand"><span class="logo"><i></i><i></i></span><b>Budget Tracker</b></div><label class="search">⌕ <input placeholder="Rechercher" aria-label="Rechercher"></label><nav class="desktop-nav">${screens.slice(1).map(s=>`<a class="${s[0]===current?"active":""}" href="#${s[0]}">${s[2]}</a>`).join("")}</nav><button class="theme-toggle" onclick="toggleTheme()" aria-label="Activer le mode sombre">${document.documentElement.dataset.theme==="dark"?"☀":"☾"}</button><span class="bell">♧</span><span class="avatar">LT</span></header>`;
const shell = (screen,main,aside) => `<div class="canvas"><div class="shell">${topbar(screen)}<main class="main">${main}</main><aside class="sidebar">${aside}</aside></div></div>`;
const recent = [
  ["charges","Loyer","01 août","Appartement",82000], ["alimentaire","Alimentation générale","03 août","Supermarché",14850],
  ["transport","Carburant","08 août","Station-service",8200], ["loisirs","Sorties","12 août","Cinéma",3400],
  ["sante","Pharmacie","15 août","Ordonnance",5250]
];
function lastExpenses(){return card(`<div class="flex justify-between"><h2>5 dernières dépenses</h2><button class="secondary">Tout voir</button></div><div class="table mt-3"><div class="tr table-head"><span>Date</span><span>Catégorie</span><span>Description</span><span>Montant</span><span></span></div>${recent.map(r=>`<div class="tr"><span>${r[2]}</span><span class="flex items-center gap-2">${icon(r[0],true)}<span><b>${r[1]}</b><small class="caption block">${roots[r[0]].label}</small></span></span><span>${r[3]}</span><strong class="text-red-500">−${format(r[4])}</strong><button class="dots">•••</button></div>`).join("")}</div>`,"overflow-hidden p-5");}
function dashboard(){const main=title("Août 2026","Vue mensuelle",pill("‹　Août 2026　›"))+`<div class="grid gap-4 lg:grid-cols-3">${stat("Entrées d’argent",format(260000),"emerald","↗","2 entrées ce mois")+stat("Dépenses",format(186450),"red","↓","72 % des revenus")+stat("Solde",format(73550),"blue","▰","28 % disponible")}</div>`+card(`<div><h2>Répartition des revenus</h2><p class="caption mt-1">100 % = entrées d’argent du mois</p>${donut()}</div><div class="usage-list"><h2>Utilisation par catégorie</h2>${categoryRow("charges",102900,40)+categoryRow("alimentaire",41800,16)+categoryRow("transport",21500,8)+categoryRow("loisirs",12750,5)+categoryRow("sante",7500,3)}</div>`,`mt-4 grid gap-6 p-5 xl:grid-cols-[.8fr_1.3fr]`)+`<div class="mt-4">${lastExpenses()}</div>`;const aside=`<h2>Entrées du mois</h2>${card(`<p class="caption">03 août · Salaire</p><b>${format(230000)}</b>`,"mt-4 p-4")+card(`<p class="caption">21 août · Mission freelance</p><b>${format(30000)}</b>`,"mt-3 p-4")}<button class="primary mt-4 w-full" onclick="location.hash='#income'">＋ Ajouter une entrée</button><h2 class="mt-8">Actions rapides</h2><button class="secondary mt-3 w-full" onclick="location.hash='#expense'">＋ Nouvelle dépense</button>`;return shell("dashboard",main,aside);}
function general(){const main=title("Comparaison mensuelle","Septembre 2025 — Août 2026",pill("12 derniers mois　⌄"))+`<div class="grid gap-4 lg:grid-cols-3">${stat("Revenus cumulés",format(3120000),"emerald","↗","+8,4 % sur 12 mois")+stat("Dépenses cumulées",format(2438600),"red","↓","+3,1 % sur 12 mois")+stat("Solde cumulé",format(681400),"blue","▰","21,8 % conservé")}</div>`+card(`<div class="flex justify-between"><h2>Revenus et dépenses par mois</h2><p class="caption"><span class="text-emerald-500">■ Revenus</span>　<span class="text-red-500">■ Dépenses</span></p></div>${monthBars()}`,"mt-4 p-5")+card(`<h2>Solde mensuel</h2><div class="balance-strip">${[65,82,54,91,70,110,88,105,76,120,98,74].map((v,i)=>`<div><i style="height:${v}px"></i><small>${["Sep","Oct","Nov","Déc","Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août"][i]}</small></div>`).join("")}</div>`,"mt-4 p-5");const aside=`<h2>Points clés</h2>${card(`<p class="caption">Meilleur solde</p><b>Juin · ${format(96500)}</b>`,"mt-4 p-4")+card(`<p class="caption">Dépenses moyennes</p><b>${format(203217)}</b>`,"mt-3 p-4")+card(`<p class="caption">Revenus moyens</p><b>${format(260000)}</b>`,"mt-3 p-4")}<h2 class="mt-8">Lecture</h2><p class="muted mt-2 text-sm">Comparaison fondée uniquement sur les entrées et dépenses réelles de chaque mois.</p>`;return shell("general",main,aside);}
function categories(){const tree=Object.entries(roots).map(([key,r])=>card(`<div class="tree-root">${icon(key)}<div class="flex-1"><b>${r.label}</b><p class="caption">${r.children.length} sous-catégories</p></div><button class="secondary">＋ Enfant</button><button class="dots">•••</button></div><div class="tree-children">${r.children.map((child,i)=>`<div class="tree-child"><span class="tree-line"></span>${icon(key,true)}<div class="flex-1"><b>${child}</b><p class="caption">${i===1&&key==="alimentaire"?"Couleur propre":"Hérite de "+r.label}</p></div><span class="inherit-dot ${i===1&&key==="alimentaire"?"bg-amber-400":r.tone.split(" ")[0]}"></span><button class="dots">•••</button></div>`).join("")}</div>`,"p-4")).join("");const main=title("Catégories","Hiérarchie racine → enfant",`<button class="primary">＋ Catégorie racine</button>`)+`<div class="space-y-3">${tree}</div>`;const aside=`<h2>Modifier la catégorie</h2><label class="form-label">Nom<input class="field" value="Alimentaire"></label><label class="form-label">Niveau<select class="field"><option>Catégorie racine</option><option>Catégorie enfant</option></select></label><p class="form-label">Icône</p><div class="flex flex-wrap gap-2">${Object.keys(roots).map(k=>icon(k)).join("")}</div><p class="form-label">Couleur</p><div class="flex gap-2">${["orange","emerald","blue","violet","rose","amber"].map(c=>`<button class="color-swatch bg-${c}-400" aria-label="${c}"></button>`).join("")}</div><div class="mt-6 flex gap-2"><button class="secondary flex-1">Annuler</button><button class="primary flex-1">Enregistrer</button></div><div class="inherit-note"><b>Héritage</b><p>Un enfant sans couleur ou icône propre reprend celles de sa racine.</p></div>`;return shell("categories",main,aside);}
function expense(){const main=title("Nouvelle dépense","Enregistrer un mouvement réel",pill("Août 2026"))+card(`<form class="entry-form" onsubmit="event.preventDefault();showToast('Dépense enregistrée')"><div class="form-step"><span>1</span><div><h2>Catégorie racine</h2><p class="caption">Choisissez d’abord une famille</p></div></div><div class="category-choice">${Object.keys(roots).map((k,i)=>`<label class="choice ${i===0?"selected":""}"><input type="radio" name="root" ${i===0?"checked":""}>${icon(k)}<b>${roots[k].label}</b></label>`).join("")}</div><div class="form-step mt-8"><span>2</span><div><h2>Catégorie enfant</h2><p class="caption">La dépense est toujours rattachée à un enfant</p></div></div><div class="child-choice">${roots.alimentaire.children.map((c,i)=>`<label class="choice ${i===0?"selected":""}"><input type="radio" name="child" ${i===0?"checked":""}>${icon("alimentaire",true)}<span><b>${c}</b><small class="caption block">Alimentaire</small></span></label>`).join("")}</div><div class="form-grid"><label class="form-label">Montant<input class="field amount-field" inputmode="numeric" value="14 850"><span class="field-suffix">FCFP</span></label><label class="form-label">Date<input class="field" type="date" value="2026-08-05"></label><label class="form-label full">Description <small>(optionnelle)</small><input class="field" value="Supermarché semaine 1"></label></div><div class="form-actions"><button type="button" class="secondary">Annuler</button><button class="primary">Enregistrer la dépense</button></div></form>`,"p-6");const aside=`<h2>Résumé</h2><div class="summary-card">${icon("alimentaire")}<div><p class="caption">Alimentaire</p><b>Alimentation générale</b></div><strong>14 850 FCFP</strong></div><h2 class="mt-8">Saisie rétroactive</h2><p class="muted mt-2 text-sm">La date peut appartenir à n’importe quel mois passé. Le mouvement apparaîtra automatiquement dans ce mois.</p>`;return shell("expense",main,aside);}
function income(){const main=title("Nouvelle entrée d’argent","Aucune catégorie nécessaire",pill("Août 2026"))+card(`<form class="entry-form compact-form" onsubmit="event.preventDefault();showToast('Entrée enregistrée')"><div class="income-hero"><span class="icon h-14 w-14 bg-emerald-100 text-emerald-500 text-2xl">↗</span><div><h2>Entrée réelle</h2><p class="caption">Salaire, freelance, remboursement ou autre revenu</p></div></div><div class="form-grid mt-6"><label class="form-label">Montant<input class="field amount-field" inputmode="numeric" value="230 000"><span class="field-suffix">FCFP</span></label><label class="form-label">Date<input class="field" type="date" value="2026-08-03"></label><label class="form-label full">Description <small>(optionnelle)</small><input class="field" value="Salaire août 2026"></label></div><div class="form-actions"><button type="button" class="secondary">Annuler</button><button class="primary">Enregistrer l’entrée</button></div></form>`,"p-6")+card(`<h2>Entrées récentes</h2><div class="row"><span class="icon h-10 w-10 bg-emerald-100 text-emerald-500">↗</span><div class="flex-1"><b>Salaire juillet 2026</b><p class="caption">03 juillet</p></div><strong class="text-emerald-500">+230 000 FCFP</strong></div><div class="row"><span class="icon h-10 w-10 bg-emerald-100 text-emerald-500">↗</span><div class="flex-1"><b>Mission freelance</b><p class="caption">21 juillet</p></div><strong class="text-emerald-500">+30 000 FCFP</strong></div>`,"mt-4 p-5");const aside=`<h2>Règle métier</h2><div class="inherit-note mt-4"><b>Pas de catégorie</b><p>Une entrée d’argent contient uniquement montant, date et description facultative.</p></div><h2 class="mt-8">Impact mensuel</h2>${card(`<p class="caption">Revenus après saisie</p><b class="text-emerald-500">${format(490000)}</b>`,"mt-3 p-4")}<p class="muted mt-4 text-sm">Les pourcentages d’utilisation seront recalculés sur ce nouveau total.</p>`;return shell("income",main,aside);}
function designSystem(){const colors=[["Pêche","#FFD2C4"],["Corail","#FF8A66"],["Surface","#F3F5FA"],["Bleu","#2F80ED"],["Vert","#23C48E"],["Rouge","#FF5B62"],["Encre","#172033"],["Gris","#8A90A2"]];const main=title("Design system v2","Cockpit financier chaleureux · modèle sans budget manuel")+card(`<h2>Fondations visuelles inchangées</h2><h3 class="subheading">Palette</h3><div class="color-grid">${colors.map(c=>`<div><span style="background:${c[1]}"></span><b>${c[0]}</b><small>${c[1]}</small></div>`).join("")}</div><h3 class="subheading">Typographie</h3><div class="grid gap-5 md:grid-cols-2"><div><p class="text-4xl font-extrabold">Titre principal</p><p class="caption">32 / 40 · ExtraBold</p></div><div><p class="text-2xl font-extrabold">Titre de section</p><p class="caption">22 / 30 · ExtraBold</p></div><div>Corps de texte rond, calme et amical.</div><div><b>Montant 186 450 FCFP</b></div></div>`,"p-6")+card(`<h2>Nouveaux composants métier</h2><div class="component-grid"><div><p class="label">CAMEMBERT REVENUS</p>${donut()}</div><div><p class="label">HIÉRARCHIE</p>${categoryRow("alimentaire",undefined,undefined)+categoryRow("alimentaire",14850,6,"Alimentation générale")}</div><div><p class="label">SÉLECTION 2 NIVEAUX</p><div class="mini-flow"><b>Alimentaire</b><span>→</span><b>Alimentation générale</b></div><p class="caption mt-2">Racine puis enfant obligatoire</p></div><div><p class="label">UTILISATION</p><div class="usage-demo"><b>Charges fixes</b><strong>40 %</strong><span class="progress"><i class="bg-orange-400" style="width:40%"></i></span></div></div></div>`,"mt-4 p-6")+card(`<h2>Règles métier UI</h2><ul class="rules"><li>Le revenu réel mensuel constitue toujours la base 100 %.</li><li>Aucun objectif ou budget manuel n’est affiché ou édité.</li><li>Toute dépense exige une racine puis une catégorie enfant.</li><li>Une entrée d’argent ne possède jamais de catégorie.</li><li>Un enfant sans style propre hérite couleur et icône de sa racine.</li><li>Toute vue et toute saisie sont scopées par date/mois.</li></ul>`,"mt-4 p-6");const aside=`<h2>Écrans inclus</h2><ol class="rules"><li>Dashboard mensuel</li><li>Comparaison mensuelle</li><li>Catégories hiérarchiques</li><li>Saisie de dépense</li><li>Saisie d’entrée</li></ol><div class="inherit-note mt-8"><b>Retiré</b><p>Budget mensuel, objectifs, BudgetProgress, CategoryBudgetRow et récurrentes.</p></div>`;return shell("design-system",main,aside);}
const pages={"design-system":designSystem,dashboard,general,categories,expense,income};
function showToast(message){let t=document.createElement("div");t.className="toast";t.textContent="✓ "+message;document.body.append(t);setTimeout(()=>t.remove(),2200);}
function render(){const key=location.hash.slice(1);const id=pages[key]?key:"design-system";document.querySelector("#app").innerHTML=pages[id]();document.querySelectorAll(".preview-nav a,.mobile-switcher a").forEach(a=>a.classList.toggle("active",a.hash===`#${id}`));}
document.querySelector(".mobile-switcher").innerHTML=screens.map(s=>`<a href="#${s[0]}">${s[2]}</a>`).join("");
applyTheme(getPreferredTheme(),false);
addEventListener("hashchange",render);render();

</script>
</body>
</html>
