name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: ./vendor/bin/pint --test

  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: composer test

  test-pgsql:
    name: Tests (Pest, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pdo_pgsql, mbstring, dom, curl, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: composer test

  deploy:
    name: Deploy
    needs: [lint, test, test-pgsql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.PROD_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Ensure shared directories exist
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.PROD_SERVER_USER }}@${{ vars.PROD_SERVER_IP }}" \
            "mkdir -p '${{ vars.PROD_APP_PATH }}/shared/vendor' '${{ vars.PROD_APP_PATH }}/shared/build'"

      - name: Rsync vendor/
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            vendor/ "${{ vars.PROD_SERVER_USER }}@${{ vars.PROD_SERVER_IP }}:${{ vars.PROD_APP_PATH }}/shared/vendor/"

      - name: Rsync built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            public/build/ "${{ vars.PROD_SERVER_USER }}@${{ vars.PROD_SERVER_IP }}:${{ vars.PROD_APP_PATH }}/shared/build/"

      - name: Trigger deployment
        run: |
          BRANCH="${{ github.ref_name }}"
          ssh -i ~/.ssh/deploy_key "${{ vars.PROD_SERVER_USER }}@${{ vars.PROD_SERVER_IP }}" \
            "bash /home/deploy/deploy.sh $(printf '%q' "$BRANCH") $(printf '%q' "${{ vars.PROD_APP_PATH }}")"
